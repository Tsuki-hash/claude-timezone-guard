[package]
name = "claude-fingerprint"
version = "1.0.0"
edition = "2021"
description = "Claude 指纹切换器 - 一键切换系统时区 / 区域语言 / 浏览器语言"
license = "MIT"
repository = "https://github.com/Tsuki-hash/claude-timezone-guard"
readme = "README.md"

[dependencies]
egui = "0.31"
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
winreg = "0.52"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
# 打开参考检测页。刻意不用 `cmd /C start`：裸名 cmd 会被 CreateProcess 的
# 搜索顺序（应用目录→当前目录→System32→PATH）劫持，而 cmd 还会二次解析
# 参数字符串。webbrowser 走 ShellExecuteW，已在依赖树里（egui-winit 引入）。
webbrowser = "1"
# 出口侧风险估算（status --remote / 详情页「出口侧」读数）：
# 调用 FuckClaude 的公开 /api/check。rustls 纯 Rust TLS，不引 OpenSSL。
ureq = { version = "2", default-features = false, features = ["tls"] }

# 把 assets/icon.ico 嵌进 exe 资源（见 build.rs 注释）
[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# 不用 panic="abort"：后台线程 panic 时让进程能展开并给出错误，而不是无声闪退
strip = true
